; ==============================================================================
; ARK: Survival Ascended (ASA) - Ark Survival Descended Mod Configuration Template
; ==============================================================================
; File Location:
;   Singleplayer: ShooterGame/Saved/Config/Windows/GameUserSettings.ini
;   Server:       ShooterGame/Saved/Config/WindowsServer/GameUserSettings.ini
;
; Purpose:
;   This mod strips modern / post-release DLC and ASA-exclusive additions back
;   to classic ARK: Survival Evolved (ASE).
;
;   BY DEFAULT:
;   All creatures created specifically for ASA or Garuga additions are BLOCKED (False).
;   All legacy ASE creatures (including Desmodus, Sinomacrops, Wyverns, etc.) ALWAYS spawn.
;
;   To allow a creature to spawn, change its value from False to True.
;   After changing settings, run console command: admincheat DestroyWildDinos
; ==============================================================================

[ArkSurvivalDescended]
; ------------------------------------------------------------------------------
; Master Category Toggles
; ------------------------------------------------------------------------------
; If set to True, will allow all paid Fantastic Tames to spawn regardless of individual settings below.
AllowAllFantasticTames=False

; If set to True, will allow all Bob's Tall Tales creatures to spawn regardless of individual settings below.
AllowAllBobsTallTales=False

; If set to True, will allow all ASA Community Vote creatures to spawn.
AllowAllASACommunityVotes=False

; If set to True, will allow all Garuga / ARK Additions official integrations to spawn.
AllowAllGarugaAdditions=False


; ------------------------------------------------------------------------------
; Bob's Tall Tales Additions (Default: False / Blocked)
; ------------------------------------------------------------------------------
; Bob's Tall Tales: Frontier Showdown (Scorched Earth)
AllowOasisaur=False

; Bob's Tall Tales: Steampunk Ascent (Aberration)
AllowCosmo=False
AllowSir5rM8=False

; Bob's Tall Tales: Wasteland War (Extinction)
AllowArmadoggo=False


; ------------------------------------------------------------------------------
; Fantastic Tames - Paid DLC Additions (Default: False / Blocked)
; ------------------------------------------------------------------------------
AllowPyromane=False
AllowDreadmare=False


; ------------------------------------------------------------------------------
; ASA Community Vote Winners (Default: False / Blocked)
; ------------------------------------------------------------------------------
; Scorched Earth Community Vote
AllowFasolasuchus=False

; The Island & The Center Community Votes
AllowGigantoraptor=False
AllowShastasaurus=False

; Aberration Community Vote
AllowYiLing=False

; Extinction Community Vote
AllowDreadnoughtus=False


; ------------------------------------------------------------------------------
; Garuga123's ARK Additions (Official Base Game Integrations) (Default: False / Blocked)
; ------------------------------------------------------------------------------
; Note: These originated as third-party mods in ASE and were integrated into the base game in ASA.
AllowCeratosaurus=False
AllowDeinosuchus=False
AllowArchelon=False
AllowBrachiosaurus=False
AllowXiphactinus=False
AllowHelicoprion=False


; ------------------------------------------------------------------------------
; Optional / Edge Cases
; ------------------------------------------------------------------------------
; Rhyniognatha released in ASE in June 2023 (v358.5) right before ASA launched.
; By default it is ALLOWED as an official ASE creature. Set to True to block it if desired.
BlockRhyniognatha=False
